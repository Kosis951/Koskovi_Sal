# The Xcode project is generated from this file (`xcodegen generate`), so it
# can be built on GitHub's Macs without keeping a .xcodeproj in git.
name: KoskoviSal
options:
  bundleIdPrefix: cz.tkkoskovi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: cs
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Where the app talks to: the web's host name, without https://.
    KOSKOVI_HOST: sal.tkkoskovi.cz
targets:
  KoskoviSal:
    type: application
    platform: iOS
    sources:
      - KoskoviSal
      - Shared
    dependencies:
      # The lesson countdown on the lock screen and in the Dynamic Island.
      - target: KoskoviWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.tkkoskovi.sal
        PRODUCT_NAME: KoskoviSal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: KoskoviSal/KoskoviSal.entitlements
        ENABLE_PREVIEWS: YES
    entitlements:
      path: KoskoviSal/KoskoviSal.entitlements
      properties:
        aps-environment: production
    info:
      path: KoskoviSal/Info.plist
      properties:
        CFBundleDisplayName: TK Koškovi
        CFBundleDevelopmentRegion: cs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KoskoviHost: $(KOSKOVI_HOST)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  # Live Activity of the dancer's next lesson (started by the web through
  # Apple an hour before it).
  KoskoviWidgets:
    type: app-extension
    platform: iOS
    sources:
      - KoskoviWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.tkkoskovi.sal.widgets
        PRODUCT_NAME: KoskoviWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: KoskoviWidgets/Info.plist
      properties:
        CFBundleDisplayName: TK Koškovi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
