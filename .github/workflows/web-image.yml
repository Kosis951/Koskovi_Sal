# The web as a Docker image for the NAS (nas/web): ghcr.io/kosis951/koskovi_sal.
# On the NAS: Container Manager → koskovi-web → Akce → Sestavit pulls the new one.
name: Web pro NAS

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:

concurrency:
  group: web-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Docker obraz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Název obrazu
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Koškovi sál – web
          cache-from: type=gha
          cache-to: type=gha,mode=max
