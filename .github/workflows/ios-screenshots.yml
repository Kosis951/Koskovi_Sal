# App Store screenshots: the app runs in its demo mode (made-up data) in an
# iPhone simulator, the screens are captured and uploaded to App Store
# Connect. Run by hand (Actions → iOS snímky → Run workflow) or by changing
# this file or ios/screenshots/.
name: iOS snímky

on:
  push:
    branches: [main]
    paths: [".github/workflows/ios-screenshots.yml", "ios/screenshots/**"]
  workflow_dispatch:

jobs:
  screenshots:
    name: Snímky pro App Store
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      APP_ID: "6839238048"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Xcode a projekt
        working-directory: ios
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Simulátor
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          found = []
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = [int(x) for x in re.findall(r"\d+", runtime.split("iOS")[-1])]
              for d in devices:
                  if "Pro Max" in d["name"]:
                      found.append((version, d["name"], d["udid"]))
          found.sort()
          print(found[-1][2])
          ')
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          # Czech system language, light appearance, a tidy status bar.
          xcrun simctl spawn "$device" defaults write .GlobalPreferences AppleLanguages -array cs
          xcrun simctl spawn "$device" defaults write .GlobalPreferences AppleLocale cs_CZ
          xcrun simctl shutdown "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance light
          xcrun simctl status_bar "$device" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Sestavení
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project KoskoviSal.xcodeproj -scheme KoskoviSal -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/KoskoviSal.app
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/KoskoviSal.app

      - name: Snímky
        run: |
          mkdir -p shots
          n=1
          for tab in calendar lessons schedule account; do
            xcrun simctl launch --terminate-running-process "$DEVICE" cz.tkkoskovi.sal -demo -tab "$tab"
            sleep 10
            xcrun simctl io "$DEVICE" screenshot "shots/0${n}-${tab}.png"
            n=$((n + 1))
          done
          ls -la shots
          sips -g pixelWidth -g pixelHeight shots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: shots

      - name: Nahrání do App Store Connect
        run: node ios/screenshots/upload.mjs shots
