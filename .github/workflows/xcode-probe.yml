# Which Xcode versions GitHub's Macs have (for the iOS SDK Apple requires).
name: Xcode na Macích GitHubu

on:
  push:
    branches: [main]
    paths: [".github/workflows/xcode-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Xcode
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          for xcode in /Applications/Xcode_*.app; do
            echo "::notice title=${{ matrix.runner }}::$(basename "$xcode") – $(DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -showsdks 2>/dev/null | grep -o 'iphoneos[0-9.]*' | head -1)"
          done
