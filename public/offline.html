<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#003758" />
    <title>Koškovi – bez připojení</title>
    <!-- Self-contained on purpose: shown by the service worker when there is
         no connection, so it cannot rely on other files. -->
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #003758, #014d76 48%, #008fcc);
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }

      main {
        max-width: 340px;
      }

      svg {
        width: 84px;
        height: auto;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: 24px;
        font-weight: 900;
      }

      p {
        margin: 0;
        color: #afdff9;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 24px;
        border-radius: 999px;
        background: #008fcc;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 70.87 62.36" aria-label="TK Koškovi" role="img">
        <path
          fill="#ffffff"
          d="M26.65,7.43C26.71,3.26,23.24-.07,18.66,0c-4.59-.08-8.06,3.25-7.99,7.43-.06,4.17,3.4,7.47,7.99,7.38,4.59.08,8.06-3.22,7.99-7.38M25.34,26.95l13.81-4.75-3.65-9.47L0,24.94l3.65,9.47,10.16-3.49v31.44h11.53V26.95ZM60.2,7.43C60.27,3.26,56.8-.07,52.21,0c-4.59-.08-8.05,3.25-7.99,7.43-.06,4.17,3.4,7.47,7.99,7.38,4.59.08,8.06-3.22,7.99-7.38M70.87,62.36l-18.16-21.98,17.5-21.85h-13.65l-13.19,16.84h-3.91v-10.82l-11.53,4.06v33.75h11.53v-16.97h3.78l13.59,16.97h14.05Z"
        />
      </svg>
      <h1>Jste bez připojení</h1>
      <p>Kalendář sálu se načte, jakmile bude telefon zase online.</p>
      <a href="/">Zkusit znovu</a>
    </main>
  </body>
</html>
