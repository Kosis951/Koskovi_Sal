# Push relay for the Koškovi sál apps on the Synology NAS (see README.md).
# Container Manager → Project → Create → path /volume1/docker/koskovi-push.
# Secrets live in ./secrets: AuthKey.p8 (Apple push key), fcm.json (Firebase
# service account for Android) and relay-secret.txt (shared with the web as
# PUSH_RELAY_SECRET).
services:
  relay:
    image: node:22-alpine
    container_name: koskovi-relay
    init: true
    # The relay's code and web pages come from this repository at a fixed
    # commit (nothing to upload by hand); an update = a newer commit here.
    command: ["sh", "-c", "mkdir -p /opt/relay/site && cd /opt/relay && base=https://raw.githubusercontent.com/Kosis951/Koskovi_Sal/46a652fda448cd13d6c5c2d294bac1bd4361ce70/nas/push-relay && wget -qO server.mjs $$base/relay/server.mjs && for f in index.html privacy.html support.html style.css logo.svg icon.png; do wget -qO site/$$f $$base/site/$$f; done && SITE_DIR=/opt/relay/site exec node server.mjs"]
    environment:
      APNS_KEY_ID: F8QS7XUX7B
      APNS_TEAM_ID: 44HJR678JA
      APNS_BUNDLE_ID: cz.tkkoskovi.sal
      APNS_KEY_PATH: /secrets/AuthKey.p8
      RELAY_SECRET_FILE: /secrets/relay-secret.txt
      DOWNLOADS_DIR: /downloads
      TZ: Europe/Prague
    volumes:
      - ./secrets:/secrets:ro
      - ./downloads:/downloads:ro
    ports:
      # Only DSM's reverse proxy talks to it; HTTPS is done there.
      - "127.0.0.1:2587:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/relay/health"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
